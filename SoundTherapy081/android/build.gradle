buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "1.9.24"
        codegenDir = "../node_modules/.pnpm/@react-native+codegen@0.81.5_@babel+core@7.29.0/node_modules/@react-native/codegen"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

configurations.all {
    resolutionStrategy {
        // 强制统一 React Android 版本为 0.73.6
        force 'com.facebook.react:react-android:0.73.6'
        
        // 替换所有 react-native 依赖为 react-android:0.73.6
        dependencySubstitution {
            substitute module('com.facebook.react:react-native') using module('com.facebook.react:react-android:0.73.6')
        }
    }
}